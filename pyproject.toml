[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cliodinamica"
version = "0.1.0"
description = "Simulador dinámico de sistemas complejos y cliodinámica (ODEs acopladas con SciPy y clasificador MLP)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kevin Osorio" }]
# Licencia: pendiente de decidir antes de publicar en GitHub/PyPI (MIT, Apache-2.0 o propietaria).
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4", "pandas>=2.1"]
app = ["streamlit>=1.52", "plotly>=5.20", "pandas>=2.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
cliodinamica-app = "cliodinamica.ui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
